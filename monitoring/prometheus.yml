global:
  scrape_interval: 15s
  scrape_timeout: 8s

scrape_configs:
  - job_name: freight-api
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: freight-ingestion
    static_configs:
      - targets: [host.docker.internal:9101]
  - job_name: freight-outbox
    static_configs:
      - targets: [host.docker.internal:9102]
